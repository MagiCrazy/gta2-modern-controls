name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-mingw:
    name: Clang + MinGW (i686)
    runs-on: ubuntu-26.04
    env:
      CLANG_VERSION: "23"
      PREMAKE_REF: v5.0.0-beta8

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Resolve plugin-sdk commit
        id: sdk
        run: echo "sha=$(git rev-parse HEAD:vendor/plugin-sdk)" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common g++-mingw-w64-i686
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$CLANG_VERSION"
          clang++-$CLANG_VERSION --version

      - name: Install premake5
        uses: Jarod42/install-premake5@v7
        with:
          ref: ${{ env.PREMAKE_REF }}

      - name: Cache plugin_II
        id: cache-sdk
        uses: actions/cache@v6
        with:
          path: vendor/plugin-sdk/output/lib
          key: plugin_II-${{ runner.os }}-ubuntu26.04-mingw-clang${{ env.CLANG_VERSION }}-premake-${{ env.PREMAKE_REF }}-${{ steps.sdk.outputs.sha }}

      - name: Build plugin_II
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        working-directory: vendor/plugin-sdk
        run: |
          export PLUGIN_SDK_DIR="$PWD"
          premake5 gmake --file=tools/premake/premake5.lua
          make -C plugin_II config=release CXX=clang++-$CLANG_VERSION CC=clang-$CLANG_VERSION AR=ar -j"$(nproc)"

      - name: Build GTA2ModernControls
        run: |
          # Tag name for releases, dev-<short sha> otherwise (baked into the binary).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export GMC_VERSION="$GITHUB_REF_NAME"; else export GMC_VERSION="dev-${GITHUB_SHA::7}"; fi
          premake5 gmake
          make -C build config=release CXX=clang++-$CLANG_VERSION CC=clang-$CLANG_VERSION -j"$(nproc)"
          file build/bin/Release/GTA2ModernControls.asi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GTA2ModernControls
          path: build/bin/Release/GTA2ModernControls.asi
          if-no-files-found: error

  release:
    name: Publish release
    needs: clang-mingw
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: GTA2ModernControls
          path: dist

      - name: Compute checksums
        working-directory: dist
        run: |
          sha256sum GTA2ModernControls.asi > SHA256SUMS
          cat SHA256SUMS

      # Stable release: vX.Y.Z (a "-suffix" such as -rc1 marks it as a pre-release).
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/GTA2ModernControls.asi dist/SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"

      # Rolling "dev" pre-release that always tracks the tip of main.
      - name: Publish dev pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          notes="Development build of ${GITHUB_SHA::7}, rebuilt on every push to main. Not for end users."
          if gh release view dev > /dev/null 2>&1; then
            # Assets first, tag last: the tag never points at a commit whose build is not uploaded yet.
            gh release upload dev dist/GTA2ModernControls.asi dist/SHA256SUMS --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit dev --prerelease --notes "$notes"
          else
            gh release create dev dist/GTA2ModernControls.asi dist/SHA256SUMS \
              --target "$GITHUB_SHA" --prerelease --title "Development build" --notes "$notes"
          fi

  msvc:
    name: MSVC (Win32, non-blocking)
    runs-on: windows-2025-vs2026
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v3

      - name: Build plugin_II
        shell: cmd
        working-directory: vendor/plugin-sdk
        run: |
          set PLUGIN_SDK_DIR=%CD%
          tools\premake\premake5.exe vs2026 --file=tools\premake\premake5.lua || exit /b 1
          msbuild plugin_II\Plugin_II.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /verbosity:minimal

      - name: Build GTA2ModernControls
        shell: cmd
        run: |
          set GMC_VERSION=dev-%GITHUB_SHA:~0,7%
          if "%GITHUB_REF:~0,11%"=="refs/tags/v" set GMC_VERSION=%GITHUB_REF_NAME%
          vendor\plugin-sdk\tools\premake\premake5.exe vs2026 || exit /b 1
          msbuild build\GTA2ModernControls.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /verbosity:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GTA2ModernControls-msvc
          path: build/bin/Release/GTA2ModernControls.asi
          if-no-files-found: error
